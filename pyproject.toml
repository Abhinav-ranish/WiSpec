[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wispec"
version = "0.1.0"
description = "Tri-band Wi-Fi CSI sensing for room mapping and point-and-say home automation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.2"]
capture = ["pyorbbecsdk", "opencv-python"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["wispec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
